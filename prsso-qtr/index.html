<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909">
<title>PRSSO QTR | Coffee Collection</title>
<style>
:root{--bg:#090909;--panel:#151515;--gold:#c9a66b;--muted:#aaa;--line:#30291f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3a2c18 0,transparent 42%),var(--bg);color:#f7f1e7;font-family:Arial,system-ui,sans-serif;line-height:1.65}.wrap{width:min(1120px,92%);margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid #ffffff18}.logo{font-size:27px;font-weight:900;letter-spacing:5px;color:var(--gold)}.logo small{display:block;text-align:center;font-size:10px;letter-spacing:7px;color:#eee}.lang{background:#1a1a1a;border:1px solid var(--line);color:var(--gold);padding:9px 13px;border-radius:9px}.hero{text-align:center;padding:76px 0 52px}.eyebrow{color:var(--gold);letter-spacing:4px;font-size:12px}.hero h1{font-size:clamp(40px,7vw,70px);line-height:1.1;margin:14px 0}.hero p{color:var(--muted);max-width:600px;margin:auto}.line{width:70px;height:2px;background:var(--gold);margin:25px auto}.section-title{text-align:center;margin:25px 0 30px}.section-title h2{color:var(--gold);letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:65px}.card{background:linear-gradient(145deg,#1b1b1b,#101010);border:1px solid var(--line);border-radius:17px;overflow:hidden}.visual{height:190px;display:grid;place-items:center;background:radial-gradient(circle,#3a2c19,#14110d 65%,#101010)}.pack{width:112px;height:148px;border:1px solid #b7955b;border-radius:12px;background:linear-gradient(145deg,#252525,#080808);box-shadow:0 15px 35px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gold);font-weight:900;letter-spacing:2px}.pack span{font-size:9px;letter-spacing:3px;margin-top:7px;color:#eee}.info{padding:18px}.info h3{margin:0;color:var(--gold);font-size:19px}.info p{margin:8px 0 14px;color:#bdb6aa;font-size:14px;min-height:48px}.price{border-top:1px solid var(--line);padding-top:12px;color:#f4dfbb;font-weight:bold}.notice{text-align:center;color:#9f9688;font-size:12px;padding:0 0 38px}.foot{border-top:1px solid #ffffff18;text-align:center;padding:25px;color:#8d8579;font-size:12px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.visual{height:170px}.hero{padding:55px 0 35px}}
</style></head>
<body><div class="wrap">
<header><div class="logo">PRSSO<small>Q T R</small></div><button class="lang" id="lang">English</button></header>
<section class="hero"><div class="eyebrow" data-ar="مجموعة القهوة" data-en="THE COFFEE COLLECTION">مجموعة القهوة</div><h1>PRSSO <span style="color:var(--gold)">QTR</span></h1><p data-ar="اكتشف مجموعة PRSSO ونكهاتها المختلفة. تعرّف على المنتجات ومعلوماتها في مكان واحد." data-en="Discover the PRSSO collection and its different flavors. Explore product information in one place.">اكتشف مجموعة PRSSO ونكهاتها المختلفة. تعرّف على المنتجات ومعلوماتها في مكان واحد.</p><div class="line"></div></section>
<div class="section-title"><div class="eyebrow">PRSSO QTR</div><h2 data-ar="تشكيلة المنتجات" data-en="OUR COLLECTION">تشكيلة المنتجات</h2></div>
<main class="grid" id="products"></main>
<p class="notice" data-ar="معلومات المنتجات المعروضة تحتاج إلى تأكيد من الملصق الرسمي للعبوة. هذا الموقع للعرض والمعلومات فقط." data-en="Product details should be verified against the official package label. This website is for display and information only.">معلومات المنتجات المعروضة تحتاج إلى تأكيد من الملصق الرسمي للعبوة. هذا الموقع للعرض والمعلومات فقط.</p>
<footer class="foot">© PRSSO QTR · COFFEE COLLECTION</footer></div>
<script>
const products=[["Caramel","نكهة الكراميل","Caramel flavor"],["Espresso Max","إسبريسو","Espresso"],["Latte","لاتيه","Latte"],["Americano","أمريكانو","Americano"],["Mint Energy","نعناع","Mint"],["Mocha","موكا","Mocha"],["Espresso","إسبريسو","Espresso"]];
const root=document.getElementById('products');let lang='ar';
function render(){root.innerHTML=products.map(p=>'<article class="card"><div class="visual"><div class="pack">PRSSO<span>QTR</span></div></div><div class="info"><h3>'+p[0]+'</h3><p>'+ (lang==='ar'?p[1]:p[2]) +'</p><div class="price">30 ر.ق</div></div></article>').join('')}
document.getElementById('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('lang').textContent=lang==='ar'?'English':'العربية';document.querySelectorAll('[data-ar]').forEach(e=>e.textContent=e.dataset[lang]);render()};render();
</script></body></html>
